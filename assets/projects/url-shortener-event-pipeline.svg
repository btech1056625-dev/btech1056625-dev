<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#34D399" stop-opacity="0.35"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect width="480" height="250" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cp)">
<rect width="480" height="250" fill="url(#bg)"/>
<circle cx="440" cy="30" r="110" fill="url(#gl)"><animate attributeName="r" values="95;125;95" dur="5s" repeatCount="indefinite"/></circle>
